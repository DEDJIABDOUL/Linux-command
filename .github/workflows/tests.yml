# Vérifie à chaque modification que les résultats annoncés dans le cours
# sont toujours vrais (tests/run_all.sh) et que les scripts passent ShellCheck.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/ci_tests.yml
          cache-environment: true

      - name: Données reproductibles (le générateur redonne les mêmes octets)
        run: |
          python3 -I tools/generer_donnees.py
          git status --porcelain linux/
          test -z "$(git status --porcelain linux/)"

      - name: Suite de tests
        run: bash tests/run_all.sh
