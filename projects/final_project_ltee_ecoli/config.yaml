# Configuration du projet final — LTEE Ara-3 vs REL606
#
# Modifier ce fichier suffit pour changer d'échantillons, de génomes ou de
# ressources : le Snakefile ne contient aucune valeur codée en dur.

# Échantillons réels (SRA), voir data/metadata/samples.tsv pour le détail
# complet et 08_data_acquisition/ pour la méthode de documentation d'un
# jeu de données public.
samples:
  gen5000: SRR2589044
  gen15000: SRR2584863
  gen50000: SRR2584866

# génération correspondant à chaque échantillon (pour le graphique final)
generations:
  gen5000: 5000
  gen15000: 15000
  gen50000: 50000

# Génome de référence : Escherichia coli B str. REL606
# Assemblage NCBI GCA_000017985.1, séquence CP000819.1
# https://www.ncbi.nlm.nih.gov/datasets/genome/GCA_000017985.1/
reference:
  assembly_accession: GCA_000017985.1
  sequence_accession: CP000819.1
  fasta_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/017/985/GCA_000017985.1_ASM1798v1/GCA_000017985.1_ASM1798v1_genomic.fna.gz"
  gff_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/017/985/GCA_000017985.1_ASM1798v1/GCA_000017985.1_ASM1798v1_genomic.gff.gz"

# seuils de filtrage des variants (module 21, section 3) — à ajuster après
# avoir observé la profondeur de couverture réelle obtenue (voir README,
# section LIMITATIONS ; ne jamais copier un seuil sans le justifier)
filtering:
  min_qual: 30
  min_depth: 10

threads: 4

paths:
  raw: "data/raw"
  reference: "data/reference"
  results: "results"
  logs: "logs"
